name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck scripts/audit_repo.sh install.sh tests/run-tests.sh

  fixtures:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Fixture tests
        run: bash tests/run-tests.sh
      - name: Installer dry run
        run: |
          export HOME="$(mktemp -d)"
          bash install.sh --force
          test -f "$HOME/.claude/skills/safe-repo-install/SKILL.md"
          test -f "$HOME/.codex/skills/safe-repo-install/scripts/audit_repo.sh"
          bash install.sh --uninstall
          test ! -e "$HOME/.claude/skills/safe-repo-install"
